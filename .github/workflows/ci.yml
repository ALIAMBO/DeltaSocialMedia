name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel an in-progress run when a newer commit is pushed to the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: "8.4"
  PHP_EXTENSIONS: mbstring, pdo_sqlite, pdo_mysql, bcmath, intl, zip
  NODE_VERSION: "22"

jobs:
  # Build the Vite frontend. Blade views need public/build/manifest.json,
  # so the test jobs reuse this output instead of rebuilding.
  assets:
    name: Build frontend assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          # No package-lock.json is committed yet, so key the cache on package.json.
          cache-dependency-path: package.json

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Build assets
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: public/build
          retention-days: 1

  # Run the PHPUnit suite on SQLite in-memory (as configured in phpunit.xml).
  tests:
    name: Tests (SQLite)
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: public/build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  # Production runs on MySQL. Run migrations and the suite against a real
  # MySQL server to catch problems SQLite would hide.
  mysql:
    name: Tests (MySQL)
    needs: assets
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # Real env vars take precedence over the non-forced <env> values in phpunit.xml.
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/download-artifact@v8
        with:
          name: frontend-build
          path: public/build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test

  # Known-vulnerability scan of PHP and JS dependencies.
  # Non-blocking for now; tighten once existing advisories are triaged.
  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - name: Composer audit
        run: composer audit --locked

      - uses: actions/setup-node@v7
        if: ${{ !cancelled() }}
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit
        if: ${{ !cancelled() }}
        run: |
          npm install --package-lock-only --no-audit --no-fund
          npm audit --audit-level=high

  # Code style check with Laravel Pint.
  # Non-blocking for now; becomes required after a one-time `pint` reformat.
  lint:
    name: Code style (Pint)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Pint
        run: vendor/bin/pint --test
