# nixpacks.toml
[phases.setup]
nixPkgs = ["...", "php82", "nodejs"] # Ensures PHP and Node are installed

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm install",
    "npm run build"
]

[start]
cmd = "php artisan migrate --force && php artisan serve --host 0.0.0.0 --port $PORT"
