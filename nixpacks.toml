# nixpacks.toml

[phases.setup]
aptPkgs = ["ca-certificates", "git", "unzip", "zip"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm ci --prefer-offline --no-audit"
]

[phases.build]
cmds = [
    "npm run build",
    "rm -f public/hot"
]

[start]
cmd = "php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan storage:link && php artisan migrate --force && php artisan reverb:start --host=0.0.0.0 --port=8080 & php artisan queue:work & php artisan serve --host 0.0.0.0 --port $PORT"
